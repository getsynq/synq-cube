name: Release
# One workflow for the tag makes the archives and the container image. Each target is compiled
# one time, so the binary in an archive is the binary in the image. synq-cube is pure Go
# (CGO_ENABLED=0), so GoReleaser cross-compiles every target on one runner.

"on":
  push:
    tags:
      - v*.*.*

concurrency:
  group: release
  cancel-in-progress: false

# GITHUB_TOKEN is the only credential. contents: write publishes the GitHub release.
# packages: write pushes the image to ghcr.io.
permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/getsynq/synq-cube

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the previous tag for the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: version
        name: Determine the version, the build time and the image tags
        run: |
          set -euo pipefail
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          # Formatted by git, in UTC, as org.opencontainers.image.created wants RFC 3339.
          BUILD_TIME=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)

          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          # A semver prerelease has a hyphen after the version (v0.1.0-rc1). It does not move
          # :latest, as the README tells people to pull :latest.
          {
            echo "image_tags<<EOF"
            echo "${IMAGE}:${VERSION_TAG}"
            if [[ $VERSION_TAG != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      # GoReleaser publishes the release as its last step. The linker ignores -X for a symbol
      # that it cannot find, so a release with no stamp is a green build. This build of the host
      # target fails before the release is public.
      #
      # The stamp here is the one that .goreleaser.yml uses. Keep the two the same. buildinfo
      # removes the leading v of the tag, so the grep is against the bare version.
      - name: Verify the version stamp before publishing
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          set -euo pipefail
          go build \
            -ldflags "-X github.com/getsynq/synq-cube/internal/buildinfo.BuildVersion=${VERSION_TAG}" \
            -o "${RUNNER_TEMP}/synq-cube-stamped" .
          "${RUNNER_TEMP}/synq-cube-stamped" --version
          "${RUNNER_TEMP}/synq-cube-stamped" --version | grep -q "${VERSION_TAG#v}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The linux binaries of GoReleaser, with the names that the Dockerfile copies
      # (dist/synq-cube-${TARGETARCH}). Read from dist/artifacts.json and not from a guessed
      # directory name: the name has a microarchitecture suffix (linux_amd64_v1,
      # linux_arm64_v8.0) that changes with the toolchain.
      - name: Stage the binaries for the image
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            src=$(jq -r --arg a "$arch" \
              'first(.[] | select(.type == "Binary" and .goos == "linux" and .goarch == $a) | .path)' \
              dist/artifacts.json)
            if [[ -z $src || $src == "null" || ! -f $src ]]; then
              echo "::error::no linux/${arch} binary in dist/artifacts.json"
              exit 1
            fi
            cp "$src" "dist/synq-cube-${arch}"
          done
          ls -l dist/synq-cube-amd64 dist/synq-cube-arm64
          # amd64 is the architecture of the runner, so the runner can run this file.
          ./dist/synq-cube-amd64 --version | grep -q "${VERSION_TAG#v}"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No emulation: the Dockerfile runs commands only in a stage of the build platform.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.image_tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/getsynq/synq-cube
            org.opencontainers.image.title=synq-cube
            org.opencontainers.image.version=${{ steps.version.outputs.version_tag }}
            org.opencontainers.image.created=${{ steps.version.outputs.build_time }}
